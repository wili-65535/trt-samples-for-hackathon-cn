version: 1
name: 07-Tool/EnginePrinter
enabled: true
tags:
  - tool
  - engineprinter
run:
  # The published log: what a reader of this repository gets.
  - python3 main.py > log-main.py.log
  # The same example with the plan-header half enabled. That needs a module which is not part of
  # this repository, so on any checkout of it this produces exactly the output above and the log is
  # git-ignored rather than published.
  - TRT_COOKBOOK_ENGINE_INTERNAL=1 python3 main.py > log-main.py-internal.log
  # Not an example: this asserts the parser's output is *true*, and is what would catch the next
  # layout change. Without the module it reports that there is nothing to check and passes.
  - TRT_COOKBOOK_ENGINE_INTERNAL=1 python3 check_against_api.py > log-check_against_api.py.log
clean:
  - rm -rf *.trt
